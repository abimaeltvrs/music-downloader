
name: Build Music Downloader Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-studio.txt pyinstaller

      - name: Baixar FFmpeg portatil
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-download -Force
          New-Item -ItemType Directory -Path bin -Force | Out-Null

          foreach ($name in @('ffmpeg.exe', 'ffprobe.exe')) {
            $file = Get-ChildItem -Path ffmpeg-download -Filter $name -Recurse -File | Select-Object -First 1
            if (-not $file) {
              throw "Arquivo ausente: $name"
            }
            Copy-Item $file.FullName (Join-Path bin $name)
          }

          Get-ChildItem bin

      - name: Gerar executavel com FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name MusicDownloader --collect-all demucs --collect-all torch --add-binary "bin/ffmpeg.exe;bin" --add-binary "bin/ffprobe.exe;bin" main.py

      - name: Verificar FFmpeg no pacote
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('ffmpeg.exe', 'ffprobe.exe')) {
            $path = Join-Path 'dist/MusicDownloader/_internal/bin' $name
            if (-not (Test-Path $path)) {
              throw "FALHA: $path nao encontrado"
            }
            Write-Host "OK: $path"
          }

      - name: Publicar programa
        uses: actions/upload-artifact@v4
        with:
          name: MusicDownloader-Windows-com-FFmpeg
          path: dist/MusicDownloader/
          if-no-files-found: error
